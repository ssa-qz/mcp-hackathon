name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and linter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Build the baby-name database from public source files
        run: python scripts/baby_name_ingest.py

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Deterministic tool evaluation (ground truth from raw source files)
        run: python eval/run_eval.py --skip-live --iterations 3
