[project]
name = "ssa-mcp-server"
version = "1.0.0"
description = "U.S. Social Security Administration (SSA) Open Data and Public Services MCP Server — GSA AI Hackathon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SSA MCP Hackathon Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "social-security-administration",
    "open-data",
    "gsa-hackathon",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=4.0.0",
    "mcp>=2.2.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
# LLM-in-the-loop agent evaluation (eval/agent_eval.py) only.
eval = [
    "pyyaml>=6.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
]

[project.scripts]
ssa-mcp-server = "ssa_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "venv", "data", "build", "dist"]

[tool.ruff.lint]
# Legacy entrypoints intentionally add the repository root to sys.path before imports.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
